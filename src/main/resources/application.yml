spring:
  application:
    name: dispatch-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/dispatch}
    username: ${DATABASE_USER:dispatch}
    password: ${DATABASE_PASSWORD:dispatch}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    listener:
      ack-mode: record

dispatch:
  service-token: ${DISPATCH_SERVICE_TOKEN}
  kafka:
    shipment-events-topic: shipment-events.v1

server:
  port: 8080
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      service: dispatch-service
